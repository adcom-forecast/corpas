<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Corpas — ADCOM</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --black:#0A0A0A;--white:#FFFFFF;--yellow:#FFC000;
  --gray-50:#F8F8F8;--gray-100:#F0F0F0;--gray-200:#E0E0E0;
  --gray-400:#9E9E9E;--gray-600:#555555;
  --r-sm:8px;--r-md:16px;--sidebar:220px;
  --pregrado:#1877F2;--posgrado:#7C3AED;--educont:#059669;--branding:#D97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--gray-50);color:var(--black);display:flex;min-height:100vh;font-size:13px;overflow-x:hidden}
.sidebar{width:var(--sidebar);min-height:100vh;background:var(--black);position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;gap:10px}
.sidebar-logo img{height:32px;width:auto}
.logo-cliente{font-size:9px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.sidebar-nav{padding:16px 0;flex:1}
.nav-label{font-size:9px;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.12em;padding:6px 18px 3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;color:#666;font-size:12px;font-weight:500;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{color:#ccc;background:#111}
.nav-item.active{color:var(--white);border-left-color:var(--yellow);background:#111}
.nav-item svg{width:14px;height:14px;flex-shrink:0}
.sidebar-bottom{padding:14px;border-top:1px solid #1e1e1e}
.btn-refresh{width:100%;background:transparent;color:#666;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;padding:8px;border:1px solid #2a2a2a;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.btn-refresh:hover{color:var(--white);border-color:#555}
.last-update{font-size:9px;color:#333;text-align:center;margin-top:6px}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.topbar{background:var(--white);border-bottom:2px solid var(--gray-200);padding:0 28px;position:sticky;top:0;z-index:50}
.topbar-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.topbar-title{font-size:15px;font-weight:800}
.topbar-badge{font-size:10px;font-weight:700;color:#666;background:var(--gray-50);padding:5px 12px;border-radius:20px;border:1px solid var(--gray-200)}
.topbar-filters{display:flex;align-items:center;gap:8px;padding:0 0 12px;flex-wrap:wrap;overflow-x:auto}
.topbar-filters label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.tf-group{display:flex;align-items:center;gap:6px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-sm);padding:4px 10px}
.tf-select{background:transparent;border:none;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:var(--black);outline:none;cursor:pointer;padding:2px 0}
.tf-input{background:transparent;border:none;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:var(--black);outline:none;width:90px}
.tf-sep{color:#ccc;font-weight:300;font-size:16px}
.period-tag{font-size:11px;font-weight:600;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;padding:4px 12px;border-radius:20px;white-space:nowrap}
.btn-apply{background:var(--yellow);color:var(--black);font-family:'Poppins',sans-serif;font-size:11px;font-weight:800;padding:7px 18px;border:none;border-radius:var(--r-sm);cursor:pointer}
.btn-apply:hover{opacity:.85}
.btn-reset{background:transparent;color:#999;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;padding:7px 12px;border:1px solid var(--gray-200);border-radius:var(--r-sm);cursor:pointer}
.btn-reset:hover{color:var(--black);border-color:#999}
.loading-bar{height:3px;background:var(--gray-200);overflow:hidden}
.loading-bar.active::after{content:'';display:block;height:100%;width:40%;background:var(--yellow);animation:ldbar 1s ease-in-out infinite}
@keyframes ldbar{0%{margin-left:-40%}100%{margin-left:100%}}
.content{padding:24px 28px;min-width:0;overflow-x:hidden}
.section{margin-bottom:36px;opacity:0;transform:translateY(16px);transition:all .45s ease}
.section.visible{opacity:1;transform:none}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#aaa;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--gray-200)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--white);border-radius:var(--r-md);padding:18px 20px;border:1px solid var(--gray-200)}
.kpi-card.accent{border-top:3px solid var(--yellow)}
.kpi-card.accent-pre{border-top:3px solid var(--pregrado)}
.kpi-card.accent-pos{border-top:3px solid var(--posgrado)}
.kpi-card.accent-edu{border-top:3px solid var(--educont)}
.kpi-card.accent-brd{border-top:3px solid var(--branding)}
.kpi-label{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-value{font-size:20px;font-weight:800;line-height:1.2;word-break:break-all}
.kpi-sub{font-size:10px;color:#aaa;margin-top:4px}
.kpi-meta{margin-top:8px}
.kpi-meta-row{display:flex;justify-content:space-between;font-size:9px;color:#aaa;margin-bottom:3px}
.kpi-meta-row span:last-child{font-weight:700;color:#666}
.kpi-bar{height:4px;background:var(--gray-100);border-radius:2px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.fill-pre{background:var(--pregrado)}
.fill-pos{background:var(--posgrado)}
.fill-edu{background:var(--educont)}
.fill-brd{background:var(--branding)}
.fill-yellow{background:var(--yellow)}
.medio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1200px){.medio-grid{grid-template-columns:repeat(2,1fr)}}
.medio-card{background:var(--white);border-radius:var(--r-md);border:1px solid var(--gray-200);overflow:hidden}
.medio-card-header{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--gray-100)}
.medio-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:var(--white);flex-shrink:0}
.medio-name{font-size:12px;font-weight:700}
.medio-body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-label{font-size:9px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em}
.m-value{font-size:13px;font-weight:700;margin-top:1px;word-break:break-all}
.m-value.yellow{color:#B8860B}
.medio-footer{padding:9px 14px;background:var(--gray-50);border-top:1px solid var(--gray-100);display:flex;justify-content:space-between}
.mf-label{font-size:9px;color:#aaa;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mf-value{font-size:12px;font-weight:700;margin-top:2px;word-break:break-all}
.table-wrap{background:var(--white);border-radius:var(--r-md);border:1px solid var(--gray-200);overflow:hidden;margin-bottom:16px}
.table-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-100)}
.table-title{font-size:13px;font-weight:700}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--gray-50);border-bottom:2px solid var(--gray-200)}
th{padding:9px 12px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;white-space:nowrap}
th.num{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--gray-100);font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
td.bold{font-weight:700}
tr:hover td{background:#FAFAFA}
tr.total-row td{background:var(--black);color:var(--white);font-weight:700;border-bottom:none;font-size:12px}
tr.total-row td.yellow{color:var(--yellow)}
tr.mes-row{background:var(--gray-50);cursor:pointer}
tr.mes-row td{font-weight:700;font-size:12px;border-bottom:2px solid var(--gray-200)}
tr.mes-row:hover td{background:#ECECEC}
.toggle-icon{display:inline-block;transition:transform .2s;margin-right:6px;color:#aaa}
.toggle-icon.open{transform:rotate(90deg)}
tr.modal-row td{background:#FAFAFA;font-size:11px}
tr.modal-row.hidden{display:none}
tr.modal-row td:first-child{padding-left:28px;color:#666}
.prog-section{margin-bottom:28px}
.prog-section-title{font-size:12px;font-weight:800;padding:10px 16px;border-radius:var(--r-sm) var(--r-sm) 0 0;color:white;display:flex;align-items:center;gap:8px}
.prog-section-title.pre{background:var(--pregrado)}
.prog-section-title.pos{background:var(--posgrado)}
.prog-section-title.edu{background:var(--educont)}
.prog-section-title.brd{background:var(--branding)}
.prog-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.prog-search{flex:1;min-width:180px;background:var(--white);border:1px solid var(--gray-200);font-family:'Poppins',sans-serif;font-size:12px;padding:8px 12px;border-radius:var(--r-sm);outline:none}
.prog-search:focus{border-color:var(--yellow)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--black)}
th.sort-active{color:var(--black)!important}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.b-Pregrado{background:#DBEAFE;color:#1E40AF}
.b-Posgrado{background:#EDE9FE;color:#5B21B6}
.b-EduCont{background:#D1FAE5;color:#065F46}
.b-Branding{background:#FEF3C7;color:#92400E}
.b-General{background:#F1F5F9;color:#475569}
#loader{position:fixed;inset:0;background:rgba(10,10,10,.95);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loader-logo img{height:48px}
.loader-sub{font-size:12px;color:#555}
.spinner{width:32px;height:32px;border:3px solid #222;border-top-color:var(--yellow);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
// ── SHEET IDs ────────────────────────────────────────────────────────────────
const SHEET_ID = '12-tP-61OKnLdx1wONS0YT0q7O19eZ8V3ZrTDChOmyGo';
const URL_RG     = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=1686215180`;
const URL_METAS  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=913150849`;
const URL_LEADS  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=393843393`;
const URL_MAT    = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=727807157`;

// ── ESTRUCTURA DE COLUMNAS ───────────────────────────────────────────────────
// RG:     [0]Date  [1]Campaign  [2]Total Cost  [3]Conversions  [4]Medio  [5]Programa  [6]Modalidad
// METAS:  [0]Periodo  [1]Fecha Inicio  [2]Fecha fin  [3]Programa  [4]Modalidad  [5]Meta Leads  [6]Meta Matrículas  [7]%Conv  [8]Presupuesto
// LEADS:  [22]Create Date  [24]Canal de Ingreso  [25]Cuenta Maestra  [29]Programa de interés
// MAT:    [1]Created At  [2]Aspirante Matriculado  [8]Programa de interés  [10]Contacts.Canal de Ingreso

let RAW_RG=[], RAW_METAS=[], RAW_LEADS=[], RAW_MAT=[];
const $=id=>document.getElementById(id);
const MEDIOS=['facebook','google','tiktok','programatica'];
const MEDIOS_LEADS=['facebook','google','tiktok','programatica'];
const MESES_ES=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ── PARSERS ──────────────────────────────────────────────────────────────────
function fmtCOP(n){ if(!n||isNaN(n)||n===0) return '—'; return '$'+Math.round(n).toLocaleString('es-CO'); }
function fmtNz(n){ if(!n||isNaN(n)) return '—'; return Math.round(n).toLocaleString('es-CO'); }
function fmtP(n){ if(n===null||n===undefined||isNaN(n)) return '⏳'; return n.toFixed(1)+'%'; }

function parseInv(val){
  if(!val) return 0;
  const clean = String(val).replace(/[$\s]/g,'').replace(/\./g,'').replace(',','.');
  return parseFloat(clean)||0;
}

function parseLeads(val){
  if(!val) return 0;
  const clean = String(val).replace(/[$\s]/g,'').replace(',','.');
  return Math.round(parseFloat(clean)||0);
}

function parseFecha(val){
  if(!val) return {date:null, mes:'', full:''};
  const m = String(val).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m){
    const yyyy=m[3], mm=m[2].padStart(2,'0'), dd=m[1].padStart(2,'0');
    return {date:new Date(yyyy+'-'+mm+'-'+dd), mes:yyyy+'-'+mm, full:yyyy+'-'+mm+'-'+dd};
  }
  const m2 = String(val).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return {date:new Date(val), mes:m2[1]+'-'+m2[2], full:val};
  return {date:null, mes:'', full:''};
}

function fmtMes(mesStr){
  const p=mesStr.split('-');
  if(p.length<2) return mesStr;
  return MESES_ES[parseInt(p[1])]+' '+p[0];
}

// ── CARGA ────────────────────────────────────────────────────────────────────
function refreshData(){
  showLoading(true);
  $('last-update').textContent='Cargando...';
  let done=0, rendered=false;
  const TOTAL=4;
  const safety=setTimeout(()=>{ if(!rendered){ rendered=true; processAndRender(); showLoading(false); } },15000);
  const check=()=>{ if(++done===TOTAL){ clearTimeout(safety); if(!rendered){ rendered=true; processAndRender(); showLoading(false); } } };

  Papa.parse(URL_RG,{download:true,header:false,skipEmptyLines:true,
    complete:r=>{
      let data=r.data;
      // Saltar filas de metadatos PMA hasta llegar a una fecha real
      while(data.length && !String(data[0][0]).match(/^\d{1,4}[\/\-]\d/)){
        console.log('⏩ Skip metadata:',data[0][0]);
        data.shift();
      }
      // Saltar header si lo hay
      if(data.length && /date|fecha|camp/i.test(String(data[0][0]))) data.shift();
      RAW_RG=data;
      console.log('✅ RG:',RAW_RG.length,'| muestra:',RAW_RG[0]);
      check();
    },
    error:e=>{console.error('❌ RG',e); check();}
  });

  Papa.parse(URL_METAS,{download:true,header:false,skipEmptyLines:true,
    complete:r=>{ RAW_METAS=r.data;
      if(RAW_METAS.length && /period/i.test(String(RAW_METAS[0][0]))) RAW_METAS.shift();
      console.log('✅ METAS:',RAW_METAS.length,'| muestra:',RAW_METAS[0]); check(); },
    error:e=>{console.error('❌ METAS',e); check();}
  });

  Papa.parse(URL_LEADS,{download:true,header:false,skipEmptyLines:true,
    complete:r=>{ RAW_LEADS=r.data;
      if(RAW_LEADS.length && /id|fecha|first/i.test(String(RAW_LEADS[0][0]))) RAW_LEADS.shift();
      console.log('✅ LEADS:',RAW_LEADS.length); check(); },
    error:e=>{console.error('❌ LEADS',e); check();}
  });

  Papa.parse(URL_MAT,{download:true,header:false,skipEmptyLines:true,
    complete:r=>{ RAW_MAT=r.data;
      if(RAW_MAT.length && /id|created/i.test(String(RAW_MAT[0][0]))) RAW_MAT.shift();
      console.log('✅ MAT:',RAW_MAT.length); check(); },
    error:e=>{console.error('❌ MAT',e); check();}
  });
}

// ── PROCESAR Y RENDERIZAR ────────────────────────────────────────────────────
function processAndRender(){
  const fDesde=$('f-desde')?.value||'';
  const fHasta=$('f-hasta')?.value||'';
  const fMedio=$('f-medio')?.value||'';
  const fModal=$('f-modalidad')?.value||'';

  if(!RAW_RG.length){ $('kpi-grid').innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:#aaa">⚠️ Sin datos de pauta</div>'; return; }

  // Parsear RG
  // Cols: [0]Date [1]Campaign [2]Total Cost [3]Conversions [4]Medio [5]Programa [6]Modalidad
  const rgRows = RAW_RG.map(r=>{
    const f = parseFecha(r[0]);
    return {
      fecha:f.full, mes:f.mes, date:f.date,
      medio:  String(r[4]||'').toLowerCase().trim(),
      prog:   String(r[5]||'').trim(),
      modal:  String(r[6]||'').trim(),
      inv:    parseInv(r[2]),
      leadsP: parseLeads(r[3])
    };
  }).filter(r=>r.date);

  // Filtrar RG
  const filtered = rgRows.filter(r=>{
    if(fDesde && r.fecha < fDesde) return false;
    if(fHasta && r.fecha > fHasta) return false;
    if(fMedio && r.medio !== fMedio) return false;
    if(fModal && r.modal !== fModal) return false;
    return true;
  });

  // Leads CRM: col[22]=Create Date, col[24]=Canal, col[25]=Cuenta Maestra (modalidad), col[29]=Programa
  // Solo contar leads de canales de pauta
  const isLeadPauta = r => MEDIOS_LEADS.includes(String(r[24]||'').toLowerCase().trim());
  const filtLeads = RAW_LEADS.filter(r => isLeadPauta(r))
    .filter(r => !fMedio || String(r[24]||'').toLowerCase().trim() === fMedio);

  // Matrículas: col[1]=Created At, col[2]=Aspirante Matriculado (1=sí), col[8]=Programa, col[10]=Canal
  const filtMat = RAW_MAT.filter(r => parseInt(r[2]||0) === 1)
    .filter(r => !fMedio || String(r[10]||'').toLowerCase().trim() === fMedio);

  // KPIs globales
  const inv_total   = filtered.reduce((a,r)=>a+r.inv,0);
  const leads_pauta = filtered.reduce((a,r)=>a+r.leadsP,0);
  const leads_crm   = filtLeads.length;
  const matriculas  = filtMat.length;

  console.log('📊 Totales → Inv:',inv_total,'Leads P:',leads_pauta,'Leads CRM:',leads_crm,'Matrículas:',matriculas);

  // Stats por modalidad
  const GRUPOS = ['Pregrado','Posgrado','Educación Continuada','Branding'];
  const modalStats = {};
  GRUPOS.forEach(g=>{
    const rm = filtered.filter(r=>r.modal===g);
    modalStats[g] = {
      inv: rm.reduce((a,r)=>a+r.inv,0),
      leadsP: rm.reduce((a,r)=>a+r.leadsP,0)
    };
  });

  // Metas: cols [0]Periodo [1]Fecha Inicio [2]Fecha fin [3]Programa [4]Modalidad [5]Meta Leads [6]Meta Mat [7]%Conv [8]Presupuesto
  const metasByModal = {};
  if(RAW_METAS.length && fDesde && fHasta){
    RAW_METAS.forEach(r=>{
      const fIni = parseFecha(r[1]).full;
      const fFin = parseFecha(r[2]).full;
      const modal = String(r[4]||'').trim();
      if(!modal) return;
      if(fIni <= fHasta && fFin >= fDesde){
        if(!metasByModal[modal]) metasByModal[modal]={leads:0,mat:0,inv:0};
        metasByModal[modal].leads += parseFloat(String(r[5]||'0').replace(/[$,]/g,''))||0;
        metasByModal[modal].mat   += parseFloat(String(r[6]||'0').replace(/[$,]/g,''))||0;
        metasByModal[modal].inv   += parseInv(r[8]);
      }
    });
  }

  renderKPIs({inv_total,leads_pauta,leads_crm,matriculas});
  renderModalKPIs(modalStats, metasByModal);

  // Cards por canal
  const medioCards = MEDIOS.map(m=>{
    const rm  = filtered.filter(r=>r.medio===m);
    const inv = rm.reduce((a,r)=>a+r.inv,0);
    const lp  = rm.reduce((a,r)=>a+r.leadsP,0);
    const lc  = filtLeads.filter(r=>String(r[24]||'').toLowerCase().trim()===m).length;
    const mt  = filtMat.filter(r=>String(r[10]||'').toLowerCase().trim()===m).length;
    return {medio:m,inv,leads_pauta:lp,leads_crm:lc,matriculas:mt,
      cpl_pauta:lp?inv/lp:0, cpl_crm:lc?inv/lc:0};
  });
  renderMedioCards(medioCards);

  // Mes a mes: agrupado por mes → modalidad → canal
  const mesModalMap={};
  filtered.forEach(r=>{
    if(!mesModalMap[r.mes]) mesModalMap[r.mes]={};
    const modal = r.modal||'Sin modalidad';
    if(!mesModalMap[r.mes][modal]) mesModalMap[r.mes][modal]={};
    MEDIOS.forEach(m=>{ if(!mesModalMap[r.mes][modal][m]) mesModalMap[r.mes][modal][m]={inv:0}; });
    if(!mesModalMap[r.mes][modal][r.medio]) mesModalMap[r.mes][modal][r.medio]={inv:0};
    mesModalMap[r.mes][modal][r.medio].inv += r.inv;
  });
  window._mesModalData = mesModalMap;

  // Por programa: clave compuesta prog||modal
  const progMap={};
  filtered.forEach(r=>{
    if(!r.prog) return;
    const key = r.prog+'||'+r.modal;
    if(!progMap[key]) progMap[key]={
      Programa:r.prog, Modalidad:r.modal,
      inv_total:0, inv_facebook:0, inv_google:0, inv_tiktok:0, inv_programatica:0, leads_pauta:0
    };
    const p=progMap[key];
    p.inv_total+=r.inv;
    if(MEDIOS.includes(r.medio)) p['inv_'+r.medio]=(p['inv_'+r.medio]||0)+r.inv;
    p.leads_pauta+=r.leadsP;
  });

  window._progData = Object.values(progMap).map(p=>{
    // Leads CRM: col[29] = Programa de interés, col[24] = Canal
    const la = filtLeads.filter(r=>String(r[29]||'').trim()===p.Programa);
    // Matrículas: col[8] = Programa de interés
    const ma = filtMat.filter(r=>String(r[8]||'').trim()===p.Programa);
    const lc = la.length;
    const mt = ma.length;
    const lc_fb = la.filter(r=>String(r[24]||'').toLowerCase().trim()==='facebook').length;
    const lc_go = la.filter(r=>String(r[24]||'').toLowerCase().trim()==='google').length;
    return {...p, leads_crm:lc, matriculas:mt, crm_facebook:lc_fb, crm_google:lc_go,
      cpl_pauta: p.leads_pauta?p.inv_total/p.leads_pauta:0,
      cpl_crm:   lc?p.inv_total/lc:0,
      conv_pct:  lc?mt/lc*100:0};
  });

  const meses = Object.keys(mesModalMap).sort();
  const desde = fDesde||meses[0]||'';
  const hasta  = fHasta||meses[meses.length-1]||'';
  $('period-tag').textContent='📅 '+desde+' → '+hasta;
  $('last-update').textContent='Act: '+new Date().toLocaleTimeString('es-CO');

  renderMesTable();
  renderAllProgTables();
  revealSections();
}

// ── RENDER KPIs GLOBALES ──────────────────────────────────────────────────────
function renderKPIs(k){
  const cpl_p=k.leads_pauta?k.inv_total/k.leads_pauta:0;
  const cpl_c=k.leads_crm?k.inv_total/k.leads_crm:0;
  const conv=k.leads_crm?k.matriculas/k.leads_crm*100:0;
  const cards=[
    {label:'Inversión Total',    value:fmtCOP(k.inv_total),  sub:'Pauta digital total',      accent:'accent'},
    {label:'Leads Pauta',        value:fmtNz(k.leads_pauta), sub:'Generados por ads'},
    {label:'CPL Pauta',          value:fmtCOP(cpl_p),        sub:'Costo por lead plataforma'},
    {label:'Leads CRM',          value:fmtNz(k.leads_crm),   sub:'Canales pauta en CRM',     accent:'accent'},
    {label:'Matrículas',         value:fmtNz(k.matriculas),  sub:'Aspirantes matriculados'},
    {label:'CPL CRM',            value:fmtCOP(cpl_c),        sub:'Inversión / Leads CRM'},
    {label:'Tasa Conversión',    value:fmtP(conv),           sub:'Leads CRM → Matrícula'},
    {label:'Canales activos',    value:String(MEDIOS.filter(m=>filtered_inv(m)>0).length||'—'), sub:'Facebook, Google, TikTok, Prog.'},
  ];
  $('kpi-grid').innerHTML=cards.map(c=>
    `<div class="kpi-card${c.accent?' '+c.accent:''}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>`).join('');
}

// Helper para card de canales activos
function filtered_inv(m){ return (window._lastFiltered||[]).filter(r=>r.medio===m).reduce((a,r)=>a+r.inv,0); }

// ── RENDER KPIs POR MODALIDAD ─────────────────────────────────────────────────
function renderModalKPIs(stats, metas){
  const cfg={
    Pregrado:              {accent:'accent-pre', fill:'fill-pre', label:'Pregrado'},
    Posgrado:              {accent:'accent-pos', fill:'fill-pos', label:'Posgrado'},
    'Educación Continuada':{accent:'accent-edu', fill:'fill-edu', label:'Ed. Continuada'},
    Branding:              {accent:'accent-brd', fill:'fill-brd', label:'Branding'},
  };
  const cards = Object.entries(cfg).map(([modal,c])=>{
    const s = stats[modal]||{inv:0,leadsP:0};
    const meta = metas[modal];
    const cpl = s.leadsP?s.inv/s.leadsP:0;
    const pctInv = meta?.inv ? Math.min(s.inv/meta.inv*100,100) : null;
    const pctLeads = (modal!=='Branding' && meta?.leads) ? Math.min(s.leadsP/meta.leads*100,100) : null;
    const metaBar=(pct,label,fill,metaVal)=>pct!==null?`
      <div class="kpi-meta">
        <div class="kpi-meta-row"><span>${label}</span><span>${pct.toFixed(0)}%${metaVal?' · Meta: '+metaVal:''}</span></div>
        <div class="kpi-bar"><div class="kpi-bar-fill ${fill}" style="width:${pct}%"></div></div>
      </div>`:'';
    const subLine = modal==='Branding'
      ? (meta?.inv ? `Meta: ${fmtCOP(meta.inv)}` : 'Sin leads de campaña')
      : `Leads: ${fmtNz(s.leadsP)} · CPL: ${fmtCOP(cpl)}`;
    return `<div class="kpi-card ${c.accent}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${fmtCOP(s.inv)}</div>
      <div class="kpi-sub">${subLine}</div>
      ${metaBar(pctInv,'vs Presupuesto',c.fill,fmtCOP(meta?.inv))}
      ${metaBar(pctLeads,'vs Meta leads',c.fill,fmtNz(meta?.leads))}
    </div>`;
  }).join('');
  $('kpi-modal-grid').innerHTML=cards;
}

// ── RENDER MES A MES ──────────────────────────────────────────────────────────
function renderMesTable(){
  const data=window._mesModalData||{};
  const meses=Object.keys(data).sort();
  if(!meses.length){ $('mes-table').innerHTML='<div style="padding:24px;text-align:center;color:#aaa">Sin datos</div>'; return; }

  const totGlobal={};
  MEDIOS.forEach(m=>totGlobal[m]=0);
  let totTotal=0;

  const bodyRows=meses.map(mes=>{
    const modales=data[mes];
    const mesByMedio={};
    MEDIOS.forEach(m=>mesByMedio[m]=0);

    const modalRows=Object.keys(modales).sort().map(modal=>{
      const cols=MEDIOS.map(m=>{
        const v=modales[modal][m]?.inv||0;
        mesByMedio[m]+=v;
        return `<td class="num">${fmtCOP(v)}</td>`;
      });
      const modTot=MEDIOS.reduce((a,m)=>a+(modales[modal][m]?.inv||0),0);
      return `<tr class="modal-row hidden" data-mes="${mes}">
        <td>${modal}</td>${cols.join('')}<td class="num bold">${fmtCOP(modTot)}</td>
      </tr>`;
    }).join('');

    MEDIOS.forEach(m=>totGlobal[m]+=mesByMedio[m]);
    const mesTot=MEDIOS.reduce((a,m)=>a+mesByMedio[m],0);
    totTotal+=mesTot;

    return `
      <tr class="mes-row" onclick="toggleMes('${mes}',this)">
        <td><span class="toggle-icon" id="ti-${mes}">▶</span>${fmtMes(mes)}</td>
        ${MEDIOS.map(m=>`<td class="num">${fmtCOP(mesByMedio[m])}</td>`).join('')}
        <td class="num bold">${fmtCOP(mesTot)}</td>
      </tr>
      ${modalRows}`;
  }).join('');

  const totRow=`<tr class="total-row">
    <td>TOTAL</td>
    ${MEDIOS.map(m=>`<td class="num yellow">${fmtCOP(totGlobal[m])}</td>`).join('')}
    <td class="num yellow">${fmtCOP(totTotal)}</td>
  </tr>`;

  $('mes-table').innerHTML=`<table>
    <thead><tr>
      <th>Mes / Modalidad</th>
      <th class="num">Facebook</th><th class="num">Google</th>
      <th class="num">TikTok</th><th class="num">Programática</th>
      <th class="num">Total</th>
    </tr></thead>
    <tbody>${bodyRows}${totRow}</tbody>
  </table>`;
}

function toggleMes(mes){
  const icon=document.getElementById('ti-'+mes);
  const rows=document.querySelectorAll(`tr.modal-row[data-mes="${mes}"]`);
  const isOpen=icon.classList.contains('open');
  if(isOpen){ icon.classList.remove('open'); rows.forEach(r=>r.classList.add('hidden')); }
  else       { icon.classList.add('open');  rows.forEach(r=>r.classList.remove('hidden')); }
}

function sortProgGroup(gkey,col){
  const s=progSort[gkey];

            <thead><tr>
              ${th('Programa','Programa',false)}
              ${th('inv_total','Inv. Total',true)}
              <th class="num sortable" style="color:#1877F2" onclick="sortProgGroup('${g.key}','inv_facebook')">FB</th>
              <th class="num sortable" style="color:#EA4335" onclick="sortProgGroup('${g.key}','inv_google')">GO</th>
              <th class="num sortable" onclick="sortProgGroup('${g.key}','inv_tiktok')">TT</th>
              <th class="num sortable" style="color:#6366F1" onclick="sortProgGroup('${g.key}','inv_programatica')">PROG</th>
              ${extraHeaders}
            </tr></thead>
            <tbody>${tbody}${totRow}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── UTILIDADES ────────────────────────────────────────────────────────────────
function applyFilters(){ processAndRender(); }
function resetFilters(){
  const h=new Date();
  $('f-desde').value=h.getFullYear()+'-01-01';
  $('f-hasta').value=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
  $('f-medio').value=''; $('f-modalidad').value='';
  processAndRender();
}

function navTo(id,el){
  const t=document.getElementById(id);
  if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-document.querySelector('.topbar').offsetHeight-16,behavior:'smooth'});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

window.addEventListener('scroll',()=>{
  const ids=['s1','s2','s3']; const th=document.querySelector('.topbar')?.offsetHeight||100;
  let cur='s1';
  ids.forEach(id=>{ const el=document.getElementById(id); if(el&&el.getBoundingClientRect().top<=th+50) cur=id; });
  ids.forEach(id=>{ document.getElementById('nav-'+id)?.classList.toggle('active',id===cur); });
});

function revealSections(){ document.querySelectorAll('.section').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'),i*100)); }
function showLoading(on){ $('loading-bar').classList.toggle('active',on); if(!on) $('loader').style.display='none'; }

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  const h=new Date();
  $('f-desde').value=h.getFullYear()+'-01-01';
  $('f-hasta').value=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
  refreshData();
});
</script>
</body>
</html>
